<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#08040D" />
  
  <defs>
    <!-- Seamless Gradient for Heart Outline: Purple at K Spine -> Radiant Gold -->
    <linearGradient id="favHeartBlend" x1="24" y1="50" x2="88" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="14%" stop-color="#A855F7" />
      <stop offset="28%" stop-color="#C084FC" />
      <stop offset="44%" stop-color="#FDE68A" />
      <stop offset="68%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Seamless Gradient for Interior Line -->
    <linearGradient id="favLineBlend" x1="26" y1="50" x2="78" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="22%" stop-color="#A855F7" />
      <stop offset="48%" stop-color="#C084FC" />
      <stop offset="72%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- K Spine Gradient -->
    <linearGradient id="favSpineGrad" x1="15" y1="12" x2="26" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
  </defs>

  <!-- 1. K-Stem (Bold Spine) in Purple -->
  <rect x="15.5" y="12" width="10.5" height="76" rx="5.25" fill="url(#favSpineGrad)" />

  <!-- 2. Intersecting Heart with Seamless Gradient Boundary -->
  <path
    d="M 26 50
       L 52 24
       C 62 14 77 15 85 24
       C 92 33 90 44 78 50
       C 90 56 92 67 85 76
       C 77 85 62 86 52 76
       Z"
    stroke="url(#favHeartBlend)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#FBBF24"
    fill-opacity="0.12"
  />

  <!-- 3. Interior Curved Line with Seamless Gradient -->
  <path d="M 26 50 Q 51 57 78 50" stroke="url(#favLineBlend)" stroke-width="6.5" stroke-linecap="round" />
</svg>
